<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue to Article</title>
    <meta name="description" content="Watch a short video to continue to the article.">
    <meta name="robots" content="noindex">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(to bottom, #ebf2ff, rgba(246, 249, 255, 0.44), #fff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #1f2937;
        }

        .wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 599px;
            max-height: calc(100vh - 20px);
            overflow-y: auto;
            background: #fff;
            border: 1px solid #b1b1b1;
            box-shadow: 1px 1px 4px 1px rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 56px 24px 32px;
            text-align: center;
        }

        @media (max-width: 640px) {
            .wrap { padding: 0; }
            .card {
                max-width: 100%;
                max-height: 100vh;
                height: 100vh;
                border: none;
                border-radius: 0;
                box-shadow: none;
            }
        }

        .close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: #666;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close:hover { background: rgba(0, 0, 0, 0.05); color: #030087; }

        h1 {
            font-size: 24px;
            font-weight: 900;
            color: #111827;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .sub {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .cta-img {
            display: block;
            max-width: 100%;
            max-height: 55vh;
            margin: 0 auto 20px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cta-btn {
            display: block;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }

        .cta-btn:hover:not(:disabled) { background: #6366f1; }
        .cta-btn:disabled { opacity: 0.55; cursor: not-allowed; }

        .fineprint {
            margin-top: 12px;
            font-size: 12px;
            color: #9ca3af;
        }

        .status-line {
            margin-top: 10px;
            font-size: 13px;
            color: #6b7280;
            min-height: 20px;
        }

        .fallback-link {
            display: none;
            margin-top: 8px;
            font-size: 13px;
            color: #4f46e5;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
        }

        /* success state */
        .success-icon {
            width: 64px;
            height: 64px;
            margin: 24px auto 16px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.15);
            color: #16a34a;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hidden { display: none !important; }

        /* mock ad overlay */
        .ad-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .ad-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(255, 255, 255, 0.15);
            color: #e5e7eb;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            padding: 4px 10px;
            border-radius: 999px;
        }

        .ad-close {
            position: absolute;
            top: 12px;
            right: 12px;
            min-width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .ad-close:disabled { opacity: 0.4; cursor: not-allowed; }

        .ad-frame {
            width: 100%;
            max-width: 640px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #c7d2fe;
        }

        .ad-frame .play {
            font-size: 44px;
        }

        .ad-count {
            font-size: 15px;
            font-variant-numeric: tabular-nums;
        }

        .ad-progress {
            width: 100%;
            max-width: 640px;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            margin-top: 16px;
            overflow: hidden;
        }

        .ad-progress-bar {
            height: 100%;
            width: 0%;
            background: #818cf8;
            transition: width 0.2s linear;
        }

        footer {
            text-align: center;
            padding: 8px;
            font-size: 11px;
            color: #9ca3af;
        }

        footer a { color: #6b7280; }
    </style>
</head>
<body>

<div class="wrap">
    <!-- 主卡片：观看广告 -->
    <div class="card" id="mainCard">
        <button class="close" id="closeBtn" aria-label="Close">✕</button>
        <h1 id="ctaTextEl">Continue to Article</h1>
        <p class="sub" id="ctaSubEl">Watch a short video to continue reading.</p>
        <img class="cta-img" id="ctaImgEl" alt="Article preview" onerror="this.style.display='none'">
        <button class="cta-btn" id="watchBtn" disabled>Preparing ad…</button>
        <p class="status-line" id="statusLine"></p>
        <button class="fallback-link" id="fallbackLink">Ad unavailable — continue to article</button>
        <p class="fineprint">You'll be taken to the article automatically after the video finishes.</p>
    </div>

    <!-- 成功卡片：已解锁 -->
    <div class="card hidden" id="successCard">
        <div class="success-icon">✓</div>
        <h1>You're all set!</h1>
        <p class="sub" id="successSub">Redirecting to the article…</p>
        <button class="cta-btn" id="continueBtn">Continue to article →</button>
    </div>
</div>

<!-- Mock 广告全屏层 -->
<div class="ad-overlay hidden" id="adOverlay">
    <div class="ad-badge">AD · MOCK PREVIEW</div>
    <button class="ad-close" id="adCloseBtn" disabled>✕</button>
    <div class="ad-frame">
        <div class="play">▶</div>
        <div class="ad-count" id="adCount">Reward in 5s</div>
    </div>
    <div class="ad-progress"><div class="ad-progress-bar" id="adBar"></div></div>
</div>

<footer>
    <a href="/">Home</a>
</footer>

<script>
/* ============================================================
 * Rewarded gate page — config
 * 切真广告：填 NETWORK_CODE / AD_UNIT_PATH，MOCK_MODE 改 false
 * ============================================================ */
const AD_CONFIG = {
    NETWORK_CODE: '',            // Opera GAM network code, e.g. '12345678'
    AD_UNIT_PATH: '',            // e.g. '/12345678/news/rewarded'
    MOCK_MODE: true,             // Phase 3 切 false
    MOCK_READY_DELAY: 800,       // mock: 模拟 rewardedSlotReady 延迟
    MOCK_REWARD_AFTER: 5000,     // mock: 与 GAM 一致，可视满 5 秒发奖
    REAL_READY_TIMEOUT: 15000,   // real: 无填充降级超时
    REDIRECT_COUNTDOWN: 5,       // 发奖后自动跳转倒计时（秒）
    SKIP_RETURN_VISITS: true,    // 已解锁过则直接放行；false = 每次都拦
    UNLOCK_TTL_MS: 0             // 解锁态有效期（毫秒），0 = 永久
};

/* 事件钩子：仿 toppnyheter eventConfig 结构，null 时打到 console */
const EVENT_HOOKS = {
    rewardedImpressionJS: null,    // 门页曝光
    rewardedClickJS: null,         // CTA 点击
    rewardedAdImpressionJS: null,  // 广告展示
    rewardedRewardGrantedJS: null, // 发奖
    rewardedCtaClickJS: null       // 解锁后 Continue 点击
};

const DEFAULT_DESTINATION = '/news/ira-roth-conversion-window/';
const DEFAULT_CTA_IMG = 'https://res.feednews.com/assets/v2/e542f86ce3190c11ec06f724778dfe4c?quality=uhq&resize=720&cl=_en';
const STORAGE_KEY = 'rewarded_unlock';

/* ---------- pure helpers (testable) ---------- */
function resolveDestination(raw) {
    if (!raw) return DEFAULT_DESTINATION;
    // 仅允许站内绝对路径或本站 https URL，防 javascript:/外链注入
    if (/^\/[^/]/.test(raw) || raw === '/') return raw;
    if (/^https:\/\/xfpg21421\.github\.io\//.test(raw)) return raw;
    // slug 形式: ira-roth-conversion-window → /news/<slug>/
    if (/^[a-z0-9-]+$/i.test(raw)) return '/news/' + raw + '/';
    return DEFAULT_DESTINATION;
}

function readUnlocked(map, dest, now) {
    const at = map && map[dest];
    if (!at) return false;
    if (!AD_CONFIG.UNLOCK_TTL_MS) return true;
    return (now || Date.now()) - at < AD_CONFIG.UNLOCK_TTL_MS;
}

function writeUnlocked(map, dest) {
    const next = Object.assign({}, map);
    next[dest] = Date.now();
    return next;
}

function loadUnlockMap() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
}

function saveUnlockMap(map) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(map)); } catch (e) { /* private mode */ }
}

function sanitizeImgUrl(raw) {
    if (!raw) return DEFAULT_CTA_IMG;
    return /^https:\/\//.test(raw) ? raw : DEFAULT_CTA_IMG;
}

/* ---------- params ---------- */
const params = new URLSearchParams(location.search);
const destination = resolveDestination(params.get('destination'));
const passthrough = {
    clientId: params.get('clientId'),
    brand: params.get('brand')
};

/* ---------- tracking ---------- */
function track(name, detail) {
    const payload = Object.assign({ event: name, destination: destination }, detail || {}, passthrough);
    console.log('[rewarded]', name, payload);
    const hook = EVENT_HOOKS[name];
    if (typeof hook === 'function') { try { hook(payload); } catch (e) {} }
}

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const mainCard = $('mainCard'), successCard = $('successCard');
const watchBtn = $('watchBtn'), closeBtn = $('closeBtn'), fallbackLink = $('fallbackLink');
const statusLine = $('statusLine'), continueBtn = $('continueBtn'), successSub = $('successSub');
const adOverlay = $('adOverlay'), adCloseBtn = $('adCloseBtn'), adCount = $('adCount'), adBar = $('adBar');

/* render params into UI (textContent — no HTML injection) */
$('ctaTextEl').textContent = params.get('ctaText') || 'Continue to Article';
$('ctaImgEl').src = sanitizeImgUrl(params.get('ctaImg'));
const BTN_TEXT = params.get('ctaButtonText') || 'Watch Video & Continue →';

/* ---------- ad providers ---------- */
function MockProvider(hooks) {
    let timer = null, tick = null, granted = false;
    return {
        init() {
            setTimeout(() => hooks.onReady(), AD_CONFIG.MOCK_READY_DELAY);
        },
        show() {
            granted = false;
            adOverlay.classList.remove('hidden');
            adCloseBtn.disabled = true;
            const total = AD_CONFIG.MOCK_REWARD_AFTER;
            const start = Date.now();
            hooks.onAdImpression();
            tick = setInterval(() => {
                const elapsed = Date.now() - start;
                const left = Math.max(0, Math.ceil((total - elapsed) / 1000));
                adBar.style.width = Math.min(100, elapsed / total * 100) + '%';
                adCount.textContent = left > 0 ? 'Reward in ' + left + 's' : 'Reward granted ✓';
                if (elapsed >= total && !granted) {
                    granted = true;
                    adCloseBtn.disabled = false;
                    hooks.onGranted({ mock: true });
                }
            }, 100);
        },
        requestClose() {
            if (granted) {
                clearInterval(tick);
                adOverlay.classList.add('hidden');
                hooks.onClosed({ granted: true });
            } else {
                if (confirm('Close now? You will lose your reward.')) {
                    clearInterval(tick);
                    adOverlay.classList.add('hidden');
                    hooks.onClosed({ granted: false });
                }
            }
        },
        destroy() {}
    };
}

function GamProvider(hooks) {
    let slot = null, readyEvt = null;
    window.googletag = window.googletag || { cmd: [] };
    return {
        init() {
            const s = document.createElement('script');
            s.async = true;
            s.src = 'https://securepubads.g.doubleclick.net/tag/js/gpt.js';
            document.head.appendChild(s);
            googletag.cmd.push(() => {
                slot = googletag.defineOutOfPageSlot(
                    AD_CONFIG.AD_UNIT_PATH,
                    googletag.enums.OutOfPageFormat.REWARDED
                ).addService(googletag.pubads());
                const pa = googletag.pubads();
                pa.addEventListener('rewardedSlotReady', evt => { readyEvt = evt; hooks.onReady(); });
                pa.addEventListener('rewardedSlotGranted', evt => hooks.onGranted(evt.payload || {}));
                pa.addEventListener('rewardedSlotClosed', () => {
                    googletag.destroySlots([slot]);
                    slot = null; readyEvt = null;
                    hooks.onClosed({ granted: rewardState.granted });
                });
                googletag.enableServices();
                googletag.display(slot);
            });
        },
        show() {
            if (readyEvt) {
                hooks.onAdImpression();
                readyEvt.makeRewardedVisible();
            }
        },
        requestClose() { /* GAM renders its own close button */ },
        destroy() { if (slot) { googletag.destroySlots([slot]); slot = null; } }
    };
}

/* ---------- state machine ---------- */
const rewardState = { ready: false, granted: false, redirected: false };

function useRealAds() {
    return !AD_CONFIG.MOCK_MODE && !!AD_CONFIG.AD_UNIT_PATH;
}

const provider = useRealAds()
    ? GamProvider({ onReady, onAdImpression, onGranted, onClosed })
    : MockProvider({ onReady, onAdImpression, onGranted, onClosed });

function onReady() {
    rewardState.ready = true;
    watchBtn.disabled = false;
    watchBtn.textContent = BTN_TEXT;
    statusLine.textContent = '';
    clearTimeout(fallbackTimer);
    fallbackLink.style.display = 'none';
}

function onAdImpression() { track('rewardedAdImpressionJS'); }

function onGranted(payload) {
    if (rewardState.granted) return;
    rewardState.granted = true;
    saveUnlockMap(writeUnlocked(loadUnlockMap(), destination));
    track('rewardedRewardGrantedJS', { payload: payload });
    if (useRealAds()) showSuccess();          // real: overlay 由 GAM 管理，直接进成功态
}

function onClosed(detail) {
    if (rewardState.granted) {
        if (!useRealAds()) showSuccess();     // mock: 关闭遮罩后进成功态
    } else {
        track('close_no_reward');
        watchBtn.disabled = false;            // 允许重试
        watchBtn.textContent = BTN_TEXT;
        statusLine.textContent = 'Reward not granted. Try again when ready.';
    }
}

function showSuccess() {
    mainCard.classList.add('hidden');
    successCard.classList.remove('hidden');
    let left = AD_CONFIG.REDIRECT_COUNTDOWN;
    successSub.textContent = 'Redirecting in ' + left + 's…';
    const t = setInterval(() => {
        left--;
        if (left <= 0) { clearInterval(t); goDestination('auto_redirect'); }
        else successSub.textContent = 'Redirecting in ' + left + 's…';
    }, 1000);
}

function goDestination(eventName) {
    if (rewardState.redirected) return;
    rewardState.redirected = true;
    track(eventName);
    location.href = destination;
}

/* 无填充降级 */
let fallbackTimer = null;
if (useRealAds()) {
    fallbackTimer = setTimeout(() => {
        if (!rewardState.ready) {
            statusLine.textContent = 'No ad available right now.';
            fallbackLink.style.display = 'inline';
        }
    }, AD_CONFIG.REAL_READY_TIMEOUT);
}

/* ---------- events ---------- */
watchBtn.addEventListener('click', () => {
    if (!rewardState.ready) return;
    track('rewardedClickJS');
    watchBtn.disabled = true;
    watchBtn.textContent = 'Loading ad…';
    provider.show();
});

adCloseBtn.addEventListener('click', () => provider.requestClose());

continueBtn.addEventListener('click', () => {
    track('rewardedCtaClickJS');
    goDestination('continue_click');
});

fallbackLink.addEventListener('click', () => goDestination('fallback_no_ad'));

closeBtn.addEventListener('click', () => {
    if (rewardState.granted) { goDestination('close_after_reward'); return; }
    track('close_no_reward');
    if (history.length > 1) history.back();
    else location.href = destination;   // 直接开门页时无历史：去文章（不解锁）
});

/* ---------- boot ---------- */
(function boot() {
    const forceGate = params.get('gate') === 'force';
    if (!forceGate && AD_CONFIG.SKIP_RETURN_VISITS && readUnlocked(loadUnlockMap(), destination)) {
        track('already_unlocked');
        location.replace(destination);
        return;
    }
    track('rewardedImpressionJS', { referrer: document.referrer || null, forced: forceGate });
    provider.init();
})();

/* expose for automated tests */
window.__rewardedGate = { AD_CONFIG, resolveDestination, readUnlocked, writeUnlocked, loadUnlockMap, destination, track };
</script>

</body>
</html>
